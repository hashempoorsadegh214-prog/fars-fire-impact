name: Calculate Burned Area Sentinel-2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calculate-burned-area:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy rasterio

      - name: Calculate burned area
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
        run: |
          python calculate_burned_area_s2.py

      - name: Save burned area result and mask
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add burned_area_result.json burned_area_mask.tif

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update Sentinel-2 burned area result"

          git pull --rebase origin main

          git push origin main
