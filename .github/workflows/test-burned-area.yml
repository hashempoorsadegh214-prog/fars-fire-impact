name: Test Burned Area

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-burned-area:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run burned area test
        run: |
          python test_burned_area.py

      - name: Save test result
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add burned_area_test.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Test burned area connection"

          git push
