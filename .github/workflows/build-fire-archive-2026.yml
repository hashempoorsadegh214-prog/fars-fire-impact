import csv
import io
import json
import os
import time
from datetime import datetime, timedelta

import requests


# ============================================================
# SETTINGS
# ============================================================

MAP_KEY = os.environ.get("FIRMS_MAP_KEY")

OUTPUT_FILE = "fire_archive_2026.json"

# محدوده کلی فارس
WEST = 50.0
SOUTH = 27.0
EAST = 54.5
NORTH = 31.5

AREA = f"{WEST},{SOUTH},{EAST},{NORTH}"

# بازه آرشیو
START_DATE = datetime(2026, 1, 1)
END_DATE = datetime(2026, 8, 23)

# FIRMS در هر درخواست حداکثر 5 روز
DAY_RANGE = 5

# منابع رسمی
SOURCES = [
    "VIIRS_SNPP_SP",
    "VIIRS_NOAA20_SP",
    "VIIRS_NOAA21_SP",
    "VIIRS_SNPP_NRT",
    "VIIRS_NOAA20_NRT",
    "VIIRS_NOAA21_NRT",
]

API_BASE = (
    "https://firms.modaps.eosdis.nasa.gov"
)

AVAILABILITY_URL = (
    API_BASE
    + "/api/data_availability/csv/"
)

AREA_URL = (
    API_BASE
    + "/api/area/csv/"
)

MAX_RETRIES = 3
RETRY_DELAY = 5
TIMEOUT = 90


# ============================================================
# CHECK MAP KEY
# ============================================================

if not MAP_KEY:
    raise RuntimeError(
        "FIRMS_MAP_KEY در GitHub Secrets پیدا نشد."
    )


# ============================================================
# REQUEST HELPER
# ============================================================

def get_text(
    url,
    params=None
):

    for attempt in range(
        1,
        MAX_RETRIES + 1
    ):

        try:

            response = requests.get(
                url,
                params=params,
                timeout=TIMEOUT
            )

            if response.status_code == 200:

                return response.text


            print(
                f"HTTP {response.status_code} "
                f"| تلاش {attempt}/{MAX_RETRIES}"
            )

            print(
                response.text[:500]
            )


        except requests.RequestException as error:

            print(
                f"خطای اتصال: {error}"
            )


        if attempt < MAX_RETRIES:

            time.sleep(
                RETRY_DELAY
            )


    return None


# ============================================================
# DATA AVAILABILITY
# ============================================================

def get_availability():

    print("")
    print(
        "بررسی تاریخ‌های در دسترس FIRMS..."
    )


    url = (
        AVAILABILITY_URL
        + MAP_KEY
        + "/ALL"
    )


    text = get_text(
        url
    )


    if not text:

        raise RuntimeError(
            "امکان دریافت data_availability "
            "از FIRMS وجود ندارد."
        )


    reader = csv.DictReader(
        io.StringIO(text)
    )


    availability = {}


    for row in reader:

        source = (
            row.get("data_id")
            or
            row.get("source")
        )


        min_date = (
            row.get("min_date")
            or
            row.get("min_date_time")
        )


        max_date = (
            row.get("max_date")
            or
            row.get("max_date_time")
        )


        if not source:
            continue


        try:

            min_dt = datetime.strptime(
                min_date[:10],
                "%Y-%m-%d"
            )

            max_dt = datetime.strptime(
                max_date[:10],
                "%Y-%m-%d"
            )

        except Exception:

            continue


        availability[
            source
        ] = {

            "min_date":
                min_dt,

            "max_date":
                max_dt
        }


    return availability


# ============================================================
# LOAD AVAILABILITY
# ============================================================

availability = get_availability()


print("")
print(
    "=========================================="
)

print(
    "تاریخ‌های در دسترس منابع"
)

print(
    "=========================================="
)


for source in SOURCES:

    info = availability.get(
        source
    )


    if not info:

        print(
            f"{source}: در دسترس نبود"
        )

        continue


    print(
        f"{source}: "
        f"{info['min_date'].strftime('%Y-%m-%d')}"
        " → "
        f"{info['max_date'].strftime('%Y-%m-%d')}"
    )


print(
    "=========================================="
)


# ============================================================
# GET FIRMS AREA DATA
# ============================================================

def get_firms_data(
    source,
    start_date
):

    date_text = start_date.strftime(
        "%Y-%m-%d"
    )


    url = (
        AREA_URL
        + MAP_KEY
        + "/"
        + source
        + "/"
        + AREA
        + "/"
        + str(DAY_RANGE)
        + "/"
        + date_text
    )


    text = get_text(
        url
    )


    return text


# ============================================================
# READ FIRMS CSV
# ============================================================

def read_fires(
    csv_text,
    source
):

    if not csv_text:

        return []


    results = []


    reader = csv.DictReader(
        io.StringIO(csv_text)
    )


    for row in reader:

        try:

            latitude = float(
                row["latitude"]
            )

            longitude = float(
                row["longitude"]
            )

        except Exception:

            continue


        # محدود کردن به محدوده فارس
        if not (
            SOUTH
            <= latitude
            <= NORTH
            and
            WEST
            <= longitude
            <= EAST
        ):

            continue


        results.append(

            {

                "latitude":
                    latitude,

                "longitude":
                    longitude,

                "acq_date":
                    row.get(
                        "acq_date",
                        ""
                    ),

                "acq_time":
                    row.get(
                        "acq_time",
                        ""
                    ),

                "satellite":
                    row.get(
                        "satellite",
                        ""
                    ),

                "instrument":
                    row.get(
                        "instrument",
                        ""
                    ),

                "confidence":
                    row.get(
                        "confidence",
                        ""
                    ),

                "frp":
                    row.get(
                        "frp",
                        ""
                    ),

                "daynight":
                    row.get(
                        "daynight",
                        ""
                    ),

                "version":
                    row.get(
                        "version",
                        ""
                    ),

                "source":
                    source

            }
        )


    return results


# ============================================================
# COLLECT HISTORICAL DATA
# ============================================================

all_fires = []


current_date = START_DATE


while current_date < END_DATE:

    period_end = min(

        current_date
        + timedelta(
            days=DAY_RANGE - 1
        ),

        END_DATE
        - timedelta(
            days=1
        )
    )


    print("")
    print(
        "=========================================="
    )

    print(
        f"بازه: "
        f"{current_date.strftime('%Y-%m-%d')}"
        " → "
        f"{period_end.strftime('%Y-%m-%d')}"
    )

    print(
        "=========================================="
    )


    for source in SOURCES:

        source_info = availability.get(
            source
        )


        # اگر منبع در دسترس نیست
        if not source_info:

            print(
                f"{source}: "
                "skip - availability ندارد"
            )

            continue


        # اگر این بازه خارج از تاریخ داده منبع است
        if (
            period_end
            < source_info["min_date"]
            or
            current_date
            > source_info["max_date"]
        ):

            print(
                f"{source}: "
                "skip - خارج از بازه داده"
            )

            continue


        text = get_firms_data(
            source,
            current_date
        )


        fires = read_fires(
            text,
            source
        )


        print(
            f"{source}: "
            f"{len(fires)} رکورد"
        )


        all_fires.extend(
            fires
        )


    current_date += timedelta(
        days=DAY_RANGE
    )


# ============================================================
# SORT
# ============================================================

def sort_key(
    fire
):

    date_text = fire.get(
        "acq_date",
        ""
    )


    time_text = str(
        fire.get(
            "acq_time",
            ""
        )
    ).zfill(4)


    try:

        return datetime.strptime(
            f"{date_text} {time_text}",
            "%Y-%m-%d %H%M"
        )


    except Exception:

        return datetime.min


all_fires.sort(
    key=sort_key,
    reverse=True
)


# ============================================================
# REMOVE DUPLICATES
# ============================================================

# اولویت:
# SP بهتر از NRT
# و داده دقیق‌تر را نگه می‌داریم.

source_priority = {

    "VIIRS_SNPP_SP": 1,

    "VIIRS_NOAA20_SP": 1,

    "VIIRS_NOAA21_SP": 1,

    "VIIRS_SNPP_NRT": 2,

    "VIIRS_NOAA20_NRT": 2,

    "VIIRS_NOAA21_NRT": 2,
}


all_fires.sort(

    key=lambda fire:
        source_priority.get(
            fire.get(
                "source",
                ""
            ),
            99
        )

)


unique_fires = []


seen = set()


for fire in all_fires:

    key = (

        round(
            fire["latitude"],
            5
        ),

        round(
            fire["longitude"],
            5
        ),

        fire.get(
            "acq_date",
            ""
        ),

        fire.get(
            "acq_time",
            ""
        ),

        fire.get(
            "satellite",
            ""
        )

    )


    if key in seen:

        continue


    seen.add(
        key
    )


    unique_fires.append(
        fire
    )


# مرتب‌سازی نهایی از جدید به قدیم
unique_fires.sort(
    key=sort_key,
    reverse=True
)


# ============================================================
# GROUP BY DATE
# ============================================================

date_summary = {}


for fire in unique_fires:

    date_value = fire.get(
        "acq_date",
        ""
    )


    if not date_value:

        continue


    date_summary[
        date_value
    ] = (
        date_summary.get(
            date_value,
            0
        )
        + 1
    )


# ============================================================
# RESULT
# ============================================================

result = {

    "status":
        "SUCCESS",

    "period": {

        "start":
            START_DATE.strftime(
                "%Y-%m-%d"
            ),

        "end":
            (
                END_DATE
                - timedelta(
                    days=1
                )
            ).strftime(
                "%Y-%m-%d"
            )

    },

    "area": {

        "west":
            WEST,

        "south":
            SOUTH,

        "east":
            EAST,

        "north":
            NORTH

    },

    "sources":
        SOURCES,

    "count":
        len(unique_fires),

    "date_count":
        len(date_summary),

    "date_summary":
        date_summary,

    "fires":
        unique_fires
}


# ============================================================
# SAVE
# ============================================================

with open(
    OUTPUT_FILE,
    "w",
    encoding="utf-8"
) as file:

    json.dump(
        result,
        file,
        ensure_ascii=False,
        indent=2
    )


# ============================================================
# FINAL REPORT
# ============================================================

print("")
print(
    "=========================================="
)

print(
    "آرشیو تاریخی حریق 2026 آماده شد"
)

print(
    f"بازه: "
    f"{START_DATE.strftime('%Y-%m-%d')}"
    " → "
    f"{(END_DATE - timedelta(days=1)).strftime('%Y-%m-%d')}"
)

print(
    f"رکوردهای خام: "
    f"{len(all_fires)}"
)

print(
    f"رکوردهای یکتا: "
    f"{len(unique_fires)}"
)

print(
    f"روزهای دارای حریق: "
    f"{len(date_summary)}"
)

print(
    f"خروجی: "
    f"{OUTPUT_FILE}"
)

print(
    "=========================================="
)
