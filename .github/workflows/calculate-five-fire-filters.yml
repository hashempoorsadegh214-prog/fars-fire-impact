name: Calculate Five Fire Spatial Filters

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calculate-filters:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install numpy rasterio geopandas shapely pyproj fiona

      - name: Calculate five fire filters
        run: |
          python calculate_five_fire_filters.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add five_fires_spatial_filters_result.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Calculate spatial filters for five fires"

          git pull --rebase origin main

          git push origin main
