<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fars Fire Impact</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const map = L.map("map").setView([29.6, 53.0], 7);

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution: "&copy; OpenStreetMap contributors"
    }
  ).addTo(map);

  let farsLayer;
  let protectedLayer;
  let huntingLayer;

  fetch("fars.geojson")
    .then(response => response.json())
    .then(data => {
      farsLayer = L.geoJSON(data, {
        style: {
          color: "#ff6600",
          weight: 2,
          fillOpacity: 0.05
        }
      }).addTo(map);

      map.fitBounds(farsLayer.getBounds());
    });

  fetch("protected_areas.geojson")
    .then(response => response.json())
    .then(data => {
      protectedLayer = L.geoJSON(data, {
        style: {
          color: "#008000",
          weight: 1.5,
          fillOpacity: 0.15
        }
      }).addTo(map);
    });

  fetch("hunting_banned.geojson")
    .then(response => response.json())
    .then(data => {
      huntingLayer = L.geoJSON(data, {
        style: {
          color: "#800080",
          weight: 1.5,
          fillOpacity: 0.15
        }
      }).addTo(map);
    });
</script>

</body>
</html>
